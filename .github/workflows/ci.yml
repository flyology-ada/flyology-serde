name: Ada CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    flyology-serde-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / GNAT ${{ matrix.toolchain.gnat }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        toolchain:
          - { gnat: 16.1.0, gprbuild: 26.0.1 }
    steps:
      - name: Check out sources
        timeout-minutes: 10
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=${{ matrix.toolchain.gnat }}
            gprbuild=${{ matrix.toolchain.gprbuild }}
          cache: true
      - name: Select toolchain
        timeout-minutes: 10
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=${{ matrix.toolchain.gnat }} \
            gprbuild=${{ matrix.toolchain.gprbuild }}
      - name: Configure Flyology Alire index
        timeout-minutes: 10
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git \
            --name=flyology --before=community
      - name: Resolve dependency locks without executing projects
        run: |
          alr update
          alr -C tests update
      - name: Attest Flyology JSON source
        run: >-
          python3 tools/check_flyology_json_dependency.py
          alire/alire.lock
          tests/alire/alire.lock
      - name: Test dependency attestation
        run: python3 -m unittest discover -s tools -p 'test_check_*.py'
      - name: Build library
        run: alr build
      - name: Run assertion-enabled tests
        working-directory: tests
        run: alr run
      - name: Check production test-hook elision
        run: scripts/check-test-hook-elision.sh
      - name: Test offline generator boundary
        run: python3 -m unittest discover -s tools/generator/tests -p 'test_*.py'
      - name: Build offline Ada generator candidate
        working-directory: tools/generator/ada
        run: alr build
      - name: Build offline Ada generator candidate tests
        working-directory: tools/generator/ada
        run: alr exec -- gprbuild -p -P tests/scaffold_tests.gpr
      - name: Smoke-test offline Ada generator candidate
        run: sh tools/generator/ada/tests/smoke.sh
      - name: Reject fixture-only release sources
        run: python3 tools/generator/check_release_markers.py
      - name: Verify generated fixture manifest
        run: >-
          python3 tools/generator/verify_manifest.py
          --require-fixture tools/generator/tests/golden
      - name: Run generated Ada round trips
        working-directory: tools/generator/tests
        run: alr run
